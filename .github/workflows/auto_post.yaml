name: Auto Post Blogger

on:
  schedule:
    # Set jadwal jalan otomatis (Contoh: Jam 08.00 WIB = 01.00 UTC)
    - cron: "0 1 * * *"
  workflow_dispatch: # Agar bisa dicoba manual lewat tombol "Run workflow" di GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          REFRESH_TOKEN_JSON: ${{ secrets.REFRESH_TOKEN_JSON }}
        run: python main.py
