name: Bot Auto Post Blogger

on:
  schedule:
    # Berjalan otomatis setiap jam 07:00 WIB (00:00 UTC)
    - cron: "0 0,10 * * *"
  workflow_dispatch: # Supaya bisa dijalankan manual lewat tombol di GitHub Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-genai

      - name: Run Main Script
        env:
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python main.py
